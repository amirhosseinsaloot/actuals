# Tooling configuration for the backend. Runtime dependencies stay in
# requirements.txt; the tools below come from requirements-dev.txt.

# --- Ruff: linting + formatting ---------------------------------------------
[tool.ruff]
# Lowest interpreter the code must run on (local venv is 3.10; image is 3.12).
target-version = "py310"
line-length = 88
extend-exclude = ["budgets/migrations"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort (import ordering, mirrors the frontend's simple-import-sort)
  "UP", # pyupgrade
  "B",  # flake8-bugbear (likely bugs)
  "C4", # flake8-comprehensions
  "DJ", # flake8-django
]

[tool.ruff.lint.isort]
known-first-party = ["budgets", "config"]

# --- mypy: static type checking (django-stubs + DRF stubs plugins) ----------
[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["django_filters.*", "dj_database_url"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --- coverage.py (driven via pytest-cov: pytest --cov) -----------------------
[tool.coverage.run]
branch = true
source = ["budgets"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
